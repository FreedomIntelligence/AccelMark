      i: function(k, r) { var dict = t[lang] || t.en || {}; var v = dict[k]; if (v === undefined) v = (t.en && t.en[k]) || k; if (r) { for (var key in r) v = v.split('{'+key+'}').join(r[key]); } return v; }
    };
  })();
  window._i = function(k, r) { return window._i18n.i(k, r); };
  window._lang = function() { return window._i18n.lang(); };
  window._toggleLang = function() { var n = window._i18n.lang() === 'en' ? 'cn' : 'en'; window._i18n.lang(n); return n; };
  </script>

<script>
// Language toggle
(function(){
  function applyLang() {
    var lang = window._lang();
    var btn = document.getElementById('lang-toggle');
    if (btn) btn.textContent = (lang === 'en') ? '中文' : 'English';
    var navMap = {
      '.nav-links [href="#/"]': 'nav.home',
      '.nav-links [href="#/rankings"]': 'nav.results',
      '.nav-links [href="#/compare"]': 'nav.compare',
      '.nav-links [href="#/suites"]': 'nav.suites',
      '.nav-community': 'nav.community',
      '.nav-submit': 'nav.submit',
      '.footer-tagline': 'footer.tagline',
      '.footer-submit': 'nav.submit',
      '.footer-wanted': 'nav.wanted',
      '.footer-reproduce': 'nav.reproduce',
      '.footer-contributors': 'nav.contributors',
      '.footer-cite': 'footer.cite',
      '.footer-api': 'footer.api',
      '.footer-source': 'footer.source',
      '.footer-discuss': 'footer.discuss',
    };
    for (var sel in navMap) {
      var el = document.querySelector(sel);
      if (el) el.textContent = window._i(navMap[sel]);
    }
  }
  applyLang();
  window.addEventListener('hashchange', function(){ setTimeout(applyLang, 50); });
  var btn = document.getElementById('lang-toggle');
  if (btn) btn.addEventListener('click', function() {
    window._toggleLang();
    applyLang();
    // Save scroll position before re-render
    var scrollY = window.scrollY || window.pageYOffset;
    if (window.router && window.router.refresh) window.router.refresh();
    // Restore scroll position after DOM update
    requestAnimationFrame(function() { window.scrollTo(0, scrollY); });
  });
})();
</script>
