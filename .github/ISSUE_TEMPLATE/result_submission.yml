name: Result Submission (No-Git ZIP Upload)
description: Submit a validated AccelMark benchmark bundle generated with `python run.py --submit <dir> --zip`
title: "[Submission] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer not to open a Pull Request? Run `python run.py --submit results/community/<run_dir> --zip` and drag-and-drop the generated `.zip` file below. A maintainer will verify and merge it into the leaderboard.
  - type: input
    id: hardware
    attributes:
      label: Accelerator & Chip Count
      placeholder: e.g. NVIDIA RTX 4090 ×1, Huawei Ascend 910B2 ×4
    validations:
      required: true
  - type: dropdown
    id: suite
    attributes:
      label: Benchmark Suite
      options:
        - suite_F (Edge / Consumer)
        - suite_A (Single-Chip Chat)
        - suite_B (70B Multi-Chip TP)
        - suite_C (Quantization)
        - suite_D (28K Long Context)
        - suite_E (Multi-Chip Scaling)
        - suite_G (Sparse MoE)
        - suite_H (Sliding Window Attention)
    validations:
      required: true
  - type: input
    id: runner
    attributes:
      label: Runner Folder ID
      placeholder: e.g. nvidia_vllm_47f5d58e
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: Attach `.zip` Bundle & Validation Output
      description: Drag and drop the `.zip` archive generated by `--submit --zip`, plus any notes.
      placeholder: Drop your .zip file here…
    validations:
      required: true
